<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body class="h-[100dvh] grid grid-cols-3 grid-rows-2">
    <aside
      class="bg-sky-500 row-span-2 flex flex-col justify-between px-6 py-5"
    >
      <h1 class="text-2xl font-bold text-zinc-100">
        Calculadora de Investimentos
      </h1>

      <form class="w-full">
        <!--Investimento Inicial-->
        <div class="flex flex-col w-full my-2">
          <label for="starting-amount" class="py-1">Investimento Inicial</label>
          <div class="flex">
            <input
              type="text"
              class="w-1/6 bg-sky-400 text-center rounded-l-lg"
              value="R$"
              disabled
            />
            <input
              type="text"
              placeholder="0.00"
              class="w-1/2 bg-white border border-grey w-full rounded-r-md px-2"
              id="starting-amount"
            />
          </div>
        </div>

        <!--Aportes adicionais-->
        <div class="flex flex-col w-full my-2">
          <label for="additional-contribution" class="py-1"
            >Aportes adicionais</label
          >
          <div class="flex">
            <input
              type="text"
              class="w-1/6 bg-sky-400 text-center rounded-l-lg"
              value="R$"
              disabled
            />
            <input
              type="text"
              placeholder="0.00"
              class="w-1/2 bg-white border border-grey w-full rounded-r-md px-2"
              id="additional-contribution"
            />
          </div>
        </div>

        <!-- Prazo -->
        <div class="flex flex-col w-full my-2">
          <label for="time-amount" class="py-1">Prazo</label>
          <div class="flex">
            <input
              type="text"
              placeholder="0"
              class="w-1/2 bg-white border border-grey rounded-l-lg w-full px-2"
              id="time-amount"
            />
            <select
              id="time-amount-period"
              class="w-1/2 bg-sky-400 text-center rounded-r-md hover:bg-sky-600"
            >
              <option value="monthly">Mensal</option>
              <option value="yearty">Anual</option>
            </select>
          </div>
        </div>

        <!-- Rentabilidade -->
        <div class="flex flex-col w-full my-2">
          <label for="returnRate" class="py-1">Rentabilidade</label>
          <div class="flex">
            <input
              type="text"
              class="w-1/6 bg-sky-400 text-center rounded-l-lg"
              value="%"
              disabled
              class=""
            />
            <input
              type="text"
              placeholder="0"
              class="w-1/2 bg-white border border-grey px-2"
              id="returnRate"
            />
            <select
              id="evaluation-period"
              class="w-1/3 bg-sky-400 text-center rounded-r-md hover:bg-sky-600"
            >
              <option value="monthly">Mensal</option>
              <option value="yearty">Anual</option>
            </select>
          </div>
        </div>

        <!--Imposto sobre lucro atual-->
        <div class="flex flex-col w-full my-2">
          <label for="tax-rate" class="py-1">Impostos sobre lucro</label>
          <div class="flex">
            <input
              type="text"
              class="w-1/6 bg-sky-400 text-center rounded-l-lg"
              value="%"
              disabled
              class=""
            />
            <input
              type="text"
              placeholder="0"
              class="w-1/2 bg-white border border-grey w-full rounded-r-md px-2"
              id="tax-rate"
            />
          </div>
        </div>
      </form>

      <div class="flex h-8 w-full">
        <button
          class="border border-white w-1/2 text-white font-bold hover:bg-sky-600"
        >
          Calcular
        </button>
        <button
          class="border mx-4 border-whites w-1/2 text-white font-bold hover:bg-sky-600"
        >
          Limpar
        </button>
      </div>
    </aside>

    <main>
      <p>Resultados</p>
    </main>
  </body>
</html>
